<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Resume Registration</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">


            <div class="registration-card">


                <h1>
                    Resume Registration
                </h1>


                <p class="subtitle">
                    Register and upload your resume
                </p>


                <!-- Message -->

                <div id="message"></div>


                <!-- Registration Form -->

                <form id="registrationForm">


                    <!-- Name -->

                    <div class="mb-3">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="mb-3">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- Submit -->

                    <button
                        type="button"
                        class="btn btn-primary w-100 mb-3"
                        onclick="submitRegistration()"
                    >

                        Submit

                    </button>


                </form>


                <hr>


                <!-- Resume Upload -->

                <div class="mb-3">

                    <label>
                        Upload Resume
                    </label>


                    <input
                        type="file"
                        id="resume"
                        class="form-control"
                        accept=".doc,.docx"
                    >


                    <small>
                        Only Microsoft Word files
                        (.doc and .docx) are allowed.
                    </small>

                </div>


                <!-- Upload -->

                <button
                    type="button"
                    class="btn btn-success w-100 mb-3"
                    onclick="uploadResume()"
                >

                    Upload

                </button>


                <!-- Download -->

                <button
                    type="button"
                    id="downloadButton"
                    class="btn btn-dark w-100"
                    style="display:none;"
                    onclick="downloadResume()"
                >

                    Resume Download

                </button>


            </div>

        </div>

    </div>

</div>


<script>


// --------------------------------
// Show Message
// --------------------------------

function showMessage(
    message,
    type
) {

    document.getElementById(
        "message"
    ).innerHTML = `

        <div class="alert alert-${type}">
            ${message}
        </div>

    `;

}


// --------------------------------
// Submit Registration
// --------------------------------

async function submitRegistration() {


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    if (
        !name ||
        !email ||
        !phone
    ) {

        showMessage(
            "Please fill all details.",
            "danger"
        );

        return;

    }


    const formData =
        new FormData();


    formData.append(
        "name",
        name
    );


    formData.append(
        "email",
        email
    );


    formData.append(
        "phone",
        phone
    );


    try {


        const response =
            await fetch(
                "/submit",
                {

                    method: "POST",

                    body: formData

                }
            );


        const result =
            await response.json();


        if (result.success) {

            showMessage(
                result.message,
                "success"
            );

        }

        else {

            showMessage(
                result.message,
                "danger"
            );

        }


    }

    catch (error) {

        showMessage(
            "Unable to submit registration.",
            "danger"
        );

    }

}


// --------------------------------
// Upload Resume
// --------------------------------

async function uploadResume() {


    const fileInput =
        document.getElementById(
            "resume"
        );


    if (
        fileInput.files.length === 0
    ) {

        showMessage(
            "Please select a Word file.",
            "danger"
        );

        return;

    }


    const file =
        fileInput.files[0];


    const filename =
        file.name.toLowerCase();


    // Check extension

    if (
        !filename.endsWith(".doc") &&
        !filename.endsWith(".docx")
    ) {

        showMessage(
            "Only .doc and .docx files are allowed.",
            "danger"
        );


        fileInput.value = "";


        return;

    }


    const formData =
        new FormData();


    formData.append(
        "resume",
        file
    );


    try {


        const response =
            await fetch(
                "/upload",
                {

                    method: "POST",

                    body: formData

                }
            );


        const result =
            await response.json();


        if (result.success) {


            showMessage(
                "Resume uploaded successfully!",
                "success"
            );


            // Show Download Button

            document.getElementById(
                "downloadButton"
            ).style.display =
                "block";


        }

        else {


            showMessage(
                result.message,
                "danger"
            );

        }


    }

    catch (error) {


        showMessage(
            "Upload failed.",
            "danger"
        );

    }

}


// --------------------------------
// Download Resume
// --------------------------------

function downloadResume() {

    window.location.href =
        "/download-resume";

}


</script>


</body>

</html>
